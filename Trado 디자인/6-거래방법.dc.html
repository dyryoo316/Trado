<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
body{margin:0;background:#EDEFF2;font-family:'Pretendard',sans-serif;}
a{color:#5C7299;text-decoration:none;}
input::placeholder{color:#B4B8BF;}
*{box-sizing:border-box;}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#EDEFF2;">
<div style="position:relative;width:390px;height:844px;background:#ffffff;border-radius:44px;overflow:hidden;box-shadow:0 30px 60px rgba(30,40,60,0.18);border:8px solid #ffffff;display:flex;flex-direction:column;">
  <div style="flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0;font-size:13px;font-weight:700;color:#1A1A1A;">
    <span>9:41</span>
    <span style="font-size:12px;">📶 🔋</span>
  </div>
  <div style="padding:20px 24px 40px;display:flex;flex-direction:column;gap:20px;flex:1;min-height:0;overflow-y:auto;">
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="5-매칭성공.dc.html" style="width:34px;height:34px;border-radius:999px;background:#F4F5F7;font-size:15px;display:flex;align-items:center;justify-content:center;color:#1A1A1A;">←</a>
      <div style="font-weight:800;font-size:19px;color:#1A1A1A;">거래 방법 선택</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;background:#F4F5F7;border-radius:16px;padding:14px 16px;">
      <span style="font-size:24px;">🎧</span>
      <span style="color:#B4B8BF;">⇄</span>
      <span style="font-size:24px;">📚</span>
      <div style="margin-left:8px;">
        <div style="font-weight:700;font-size:14px;color:#1A1A1A;">무선 이어폰 ⇄ 해리포터 전권</div>
        <div style="font-size:12px;color:#8A8F98;">상대: 책벌레77</div>
      </div>
    </div>

    <button onClick="{{selectDirect}}" style="{{directCardStyle}}">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="text-align:left;">
          <div style="font-weight:800;font-size:16px;color:#1A1A1A;">직거래</div>
          <div style="font-size:13px;color:#8A8F98;margin-top:2px;">직접 만나서 받기</div>
        </div>
        <span style="{{directRadioStyle}}"></span>
      </div>
      <sc-if value="{{isDirect}}" hint-placeholder-val="{{true}}">
      <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
        <div style="display:flex;flex-direction:column;gap:6px;">
          <div style="font-size:13px;color:#8A8F98;font-weight:500;text-align:left;">희망 장소</div>
          <input type="text" placeholder="예: 강남역 2번 출구" value="{{place}}" onChange="{{onPlaceChange}}" onClick="{{stopProp}}" style="padding:14px 16px;border-radius:14px;border:none;background:#F4F5F7;font-size:15px;font-family:'Pretendard',sans-serif;outline:none;color:#1A1A1A;"/>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <div style="font-size:13px;color:#8A8F98;font-weight:500;text-align:left;">희망 시간</div>
          <input type="text" placeholder="예: 토요일 오후 3시" value="{{time}}" onChange="{{onTimeChange}}" onClick="{{stopProp}}" style="padding:14px 16px;border-radius:14px;border:none;background:#F4F5F7;font-size:15px;font-family:'Pretendard',sans-serif;outline:none;color:#1A1A1A;"/>
        </div>
      </div>
      </sc-if>
    </button>

    <button onClick="{{selectDelivery}}" style="{{deliveryCardStyle}}">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="text-align:left;">
          <div style="font-weight:800;font-size:16px;color:#1A1A1A;">택배</div>
          <div style="font-size:13px;color:#8A8F98;margin-top:2px;">원하는 주소로 받기</div>
        </div>
        <span style="{{deliveryRadioStyle}}"></span>
      </div>
      <sc-if value="{{isDelivery}}" hint-placeholder-val="{{false}}">
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:16px;">
        <div style="font-size:13px;color:#8A8F98;font-weight:500;text-align:left;">받는 주소</div>
        <input type="text" placeholder="주소를 입력해주세요" value="{{address}}" onChange="{{onAddressChange}}" onClick="{{stopProp}}" style="padding:14px 16px;border-radius:14px;border:none;background:#F4F5F7;font-size:15px;font-family:'Pretendard',sans-serif;outline:none;color:#1A1A1A;"/>
      </div>
      </sc-if>
    </button>

    <a href="7-마이페이지.dc.html" style="margin-top:auto;padding:16px;border-radius:999px;background:#7792B5;color:#fff;font-size:16px;font-weight:700;text-decoration:none;text-align:center;">확정하기</a>
  </div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { transactionMethod: 'direct', place: '', time: '', address: '' };
  renderVals() {
    const s = this.state;
    return {
      isDirect: s.transactionMethod === 'direct',
      isDelivery: s.transactionMethod === 'delivery',
      selectDirect: () => this.setState({ transactionMethod: 'direct' }),
      selectDelivery: () => this.setState({ transactionMethod: 'delivery' }),
      directCardStyle: `text-align:left;width:100%;padding:18px;border-radius:18px;background:#fff;border:2px solid ${s.transactionMethod === 'direct' ? '#7792B5' : '#EDEEF0'};cursor:pointer;font-family:'Pretendard',sans-serif;`,
      deliveryCardStyle: `text-align:left;width:100%;padding:18px;border-radius:18px;background:#fff;border:2px solid ${s.transactionMethod === 'delivery' ? '#7792B5' : '#EDEEF0'};cursor:pointer;font-family:'Pretendard',sans-serif;`,
      directRadioStyle: `width:20px;height:20px;border-radius:999px;display:inline-block;border:2px solid ${s.transactionMethod === 'direct' ? '#7792B5' : '#D8DBE0'};background:${s.transactionMethod === 'direct' ? '#7792B5' : 'transparent'};box-shadow:${s.transactionMethod === 'direct' ? 'inset 0 0 0 3px #fff' : 'none'};`,
      deliveryRadioStyle: `width:20px;height:20px;border-radius:999px;display:inline-block;border:2px solid ${s.transactionMethod === 'delivery' ? '#7792B5' : '#D8DBE0'};background:${s.transactionMethod === 'delivery' ? '#7792B5' : 'transparent'};box-shadow:${s.transactionMethod === 'delivery' ? 'inset 0 0 0 3px #fff' : 'none'};`,
      stopProp: e => e.stopPropagation(),
      place: s.place, time: s.time, address: s.address,
      onPlaceChange: e => this.setState({ place: e.target.value }),
      onTimeChange: e => this.setState({ time: e.target.value }),
      onAddressChange: e => this.setState({ address: e.target.value })
    };
  }
}

</script>
</body>
</html>
