<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
body{margin:0;background:#EDEFF2;font-family:'Pretendard',sans-serif;}
a{color:#5C7299;text-decoration:none;}
textarea::placeholder{color:#B4B8BF;}
*{box-sizing:border-box;}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#EDEFF2;">
<div style="position:relative;width:390px;height:844px;background:#ffffff;border-radius:44px;overflow:hidden;box-shadow:0 30px 60px rgba(30,40,60,0.18);border:8px solid #ffffff;display:flex;flex-direction:column;">
  <div style="flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0;font-size:13px;font-weight:700;color:#1A1A1A;">
    <span>9:41</span>
    <span style="font-size:12px;">📶 🔋</span>
  </div>
  <div style="padding:20px 24px 40px;display:flex;flex-direction:column;gap:20px;flex:1;min-height:0;overflow-y:auto;">
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="7-마이페이지.dc.html" style="width:34px;height:34px;border-radius:999px;background:#F4F5F7;font-size:15px;display:flex;align-items:center;justify-content:center;color:#1A1A1A;">←</a>
      <div style="font-weight:800;font-size:19px;color:#1A1A1A;">후기 작성</div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;background:#F4F5F7;border-radius:16px;padding:16px;">
      <span style="font-size:26px;">📷</span>
      <span style="color:#B4B8BF;">⇄</span>
      <span style="font-size:26px;">⌨️</span>
      <div style="margin-left:auto;font-size:12px;color:#8A8F98;">택배 완료</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;align-items:center;">
      <div style="font-size:14px;color:#8A8F98;font-weight:500;">받은 물건은 어땠나요?</div>
      <div style="display:flex;gap:8px;">
        <sc-for list="{{stars}}" as="star" hint-placeholder-count="5">
        <button onClick="{{star.onClick}}" style="background:none;border:none;font-size:34px;cursor:pointer;padding:0;">{{star.icon}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="font-size:14px;color:#8A8F98;font-weight:500;">후기 남기기</div>
      <textarea placeholder="거래는 어떠셨나요? 후기를 남겨주세요" value="{{reviewText}}" onChange="{{onReviewTextChange}}" style="min-height:120px;padding:14px 16px;border-radius:14px;border:none;background:#F4F5F7;font-size:15px;font-family:'Pretendard',sans-serif;outline:none;color:#1A1A1A;resize:none;"></textarea>
    </div>

    <a href="7-마이페이지.dc.html" style="margin-top:auto;padding:16px;border-radius:999px;background:#7792B5;color:#fff;font-size:16px;font-weight:700;text-decoration:none;text-align:center;">후기 등록하기</a>
  </div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { rating: 4, reviewText: '' };
  renderVals() {
    const s = this.state;
    const stars = [1,2,3,4,5].map(n => ({
      icon: n <= s.rating ? '⭐' : '☆',
      onClick: () => this.setState({ rating: n })
    }));
    return {
      stars,
      reviewText: s.reviewText,
      onReviewTextChange: e => this.setState({ reviewText: e.target.value })
    };
  }
}

</script>
</body>
</html>
