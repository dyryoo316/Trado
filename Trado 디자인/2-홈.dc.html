<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
body{margin:0;background:#EDEFF2;font-family:'Pretendard',sans-serif;}
a{color:#5C7299;text-decoration:none;}
*{box-sizing:border-box;}
::-webkit-scrollbar{width:0;height:0;}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#EDEFF2;">
<div style="position:relative;width:390px;height:844px;background:#ffffff;border-radius:44px;overflow:hidden;box-shadow:0 30px 60px rgba(30,40,60,0.18);border:8px solid #ffffff;display:flex;flex-direction:column;">
  <div style="flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0;font-size:13px;font-weight:700;color:#1A1A1A;">
    <span>9:41</span>
    <span style="font-size:12px;">📶 🔋</span>
  </div>
  <div style="flex:1;min-height:0;overflow-y:auto;padding:20px 24px 100px;display:flex;flex-direction:column;gap:18px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div style="font-weight:800;font-size:19px;color:#1A1A1A;">반가워요! 야채부락리님 👋</div>
        <div style="color:#8A8F98;font-size:13px;margin-top:4px;">오늘은 어떤 물건을 바꿔볼까요?</div>
      </div>
      <button onClick="{{bellClick}}" style="position:relative;width:40px;height:40px;border-radius:999px;background:#F4F5F7;border:none;font-size:18px;cursor:pointer;">
        🔔
        <sc-if value="{{notifBadge}}" hint-placeholder-val="{{true}}">
        <span style="position:absolute;top:6px;right:7px;width:8px;height:8px;background:#FF5C5C;border-radius:999px;border:2px solid #fff;"></span>
        </sc-if>
      </button>
    </div>

    <div style="background:#F4F5F7;border-radius:24px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;">
      <div style="font-weight:800;font-size:20px;color:#1A1A1A;line-height:1.4;">물건 하나로<br>새로운 물건을 만나요</div>
      <div style="font-size:56px;">🌪️</div>
      <a href="4-매칭.dc.html" style="width:100%;padding:16px;border-radius:999px;background:#7792B5;color:#fff;font-size:16px;font-weight:700;text-align:center;">토네이도 돌리기</a>
      <a href="3-물건등록.dc.html" style="width:100%;padding:14px;border-radius:999px;background:#fff;color:#1A1A1A;font-size:15px;font-weight:700;text-align:center;box-shadow:0 2px 6px rgba(30,40,60,0.06);">＋ 물건 등록</a>
    </div>

    <div style="display:flex;gap:12px;">
      <a href="7-마이페이지.dc.html" style="flex:1;background:#F4F5F7;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:20px;">📦</span>
        <span style="font-size:13px;font-weight:700;color:#1A1A1A;">내 물건 {{myItemCount}}개</span>
      </a>
      <a href="7-마이페이지.dc.html" style="flex:1;background:#F4F5F7;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:20px;">🔄</span>
        <span style="font-size:13px;font-weight:700;color:#1A1A1A;">진행중 교환 1건</span>
      </a>
    </div>

    <div>
      <div style="font-size:14px;color:#8A8F98;font-weight:500;margin-bottom:10px;">내 물건 목록</div>
      <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;">
        <sc-for list="{{myItems}}" as="item" hint-placeholder-count="2">
        <div style="flex:none;width:84px;background:#F4F5F7;border-radius:16px;padding:14px 8px;text-align:center;">
          <div style="font-size:32px;">{{item.emoji}}</div>
          <div style="font-size:12px;color:#1A1A1A;margin-top:6px;">{{item.name}}</div>
        </div>
        </sc-for>
      </div>
    </div>
  </div>
  <sc-if value="{{toastShow}}" hint-placeholder-val="{{false}}">
  <div style="position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;box-shadow:0 10px 20px rgba(0,0,0,0.2);white-space:nowrap;z-index:40;">🌪️ 새 교환이 성사됐어요!</div>
  </sc-if>
  <div style="position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid #EDEEF0;display:flex;align-items:center;justify-content:space-around;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#7792B5;"><span style="font-size:21px;">🏠</span><span style="font-size:11px;font-weight:700;">홈</span></div>
    <a href="4-매칭.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#B4B8BF;"><span style="font-size:21px;">🔄</span><span style="font-size:11px;font-weight:700;">매칭</span></a>
    <a href="7-마이페이지.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;color:#B4B8BF;"><span style="font-size:21px;">👤</span><span style="font-size:11px;font-weight:700;">MY</span></a>
  </div>
</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { notifBadge: true, toastShow: false, myItems: [{ emoji: '🎧', name: '무선 이어폰' }, { emoji: '📷', name: '필름카메라' }] };
  componentDidMount() {
    try {
      const extra = JSON.parse(localStorage.getItem('trado_my_items') || '[]');
      if (extra.length) this.setState(s => ({ myItems: [...s.myItems, ...extra] }));
    } catch (e) {}
  }
  renderVals() {
    return {
      notifBadge: this.state.notifBadge,
      toastShow: this.state.toastShow,
      myItems: this.state.myItems,
      myItemCount: this.state.myItems.length,
      bellClick: () => {
        this.setState({ notifBadge: false, toastShow: true });
        clearTimeout(this._t);
        this._t = setTimeout(() => this.setState({ toastShow: false }), 2400);
      }
    };
  }
}

</script>
</body>
</html>
